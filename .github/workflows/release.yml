name: Build release assets

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/build-windows.yml
    with:
      source_ref: ${{ github.event.release.tag_name }}

  linux:
    uses: ./.github/workflows/build-linux.yml
    with:
      source_ref: ${{ github.event.release.tag_name }}

  upload:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Ounce-bt-windows-x64-installer
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: Ounce-bt-windows-x64-standalone
          path: standalone-app
      - uses: actions/download-artifact@v4
        with:
          name: Ounce-bt-linux-x86_64
          path: release-assets
      - name: Package standalone app for release
        run: python -c "import shutil; shutil.make_archive('release-assets/Ounce-bt-windows-x64-standalone', 'zip', 'standalone-app')"
      - name: Attach builds to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
