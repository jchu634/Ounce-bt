name: Build Linux release ZIP

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
  pull_request:
    paths:
      - '**.py'
      - pyproject.toml
      - uv.lock
      - scripts/**
      - frontend/**
      - config/**
      - presets/**
      - .github/workflows/build-linux.yml
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.13'
          enable-cache: true
      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y file libglib2.0-0 libdbus-1-3 fontconfig fonts-dejavu-core libwayland-client0 libwayland-cursor0 libwayland-egl1 libegl1 libopengl0 libnss3 libasound2 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-render-util0 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libusb-1.0-0 libcap2-bin xvfb xauth
      - name: Backend checks
        run: |
          uv sync --locked
          uv run pytest -q
          uv run ruff check --isolated --select E4,E7,E9,F .
      - name: Build AppImage and release ZIP
        run: ./scripts/build-linux.sh
      - name: Smoke-test Qt WebEngine and bundled resources
        run: |
          xvfb-run -a build/linux/Ounce-bt.AppDir/AppRun --help
          xvfb-run -a env UV_PROJECT_ENVIRONMENT=build/linux/.venv uv run --no-sync --python 3.12 python scripts/smoke-linux.py build/linux/Ounce-bt.AppDir/AppRun
      - uses: actions/upload-artifact@v4
        with:
          name: Ounce-bt-linux-x86_64
          path: dist/*-linux-*.zip
          compression-level: 0
          if-no-files-found: error
